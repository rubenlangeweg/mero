name: Mero build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check the public source set
        run: python3 tools/check-public.py
      - name: Host tests
        run: |
          bash tools/test.sh
          python3 -m compileall -q tools
          for script in tools/*.sh; do bash -n "$script"; done
      - name: Build the full launcher without signing keys
        run: bash tools/build.sh --unsigned
      - name: HTTP boundary checks
        run: bash tools/test-protocol.sh
      - name: Build the isolated preview without signing keys
        run: bash tools/build.sh --variant preview --unsigned
